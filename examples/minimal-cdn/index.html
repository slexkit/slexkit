<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlexKit no-build host example</title>
  <link rel="stylesheet" href="/dist/slexkit.css">
</head>
<body style="margin:0;font-family:system-ui,sans-serif">
  <main style="max-width:780px;margin:auto;padding:2rem 1rem">
    <h1>No-build HTML document host</h1>
    <p>The host supplies runtime and style URLs. The payload contains only HTML and standard JavaScript.</p>
    <div id="app"></div>
  </main>
  <template id="source"><slex-card title="Voltage divider">
    <slex-grid columns="3"><slex-input id="vin" label="Input voltage" type="engineering" value="5V"></slex-input><slex-input id="r1" label="R1" type="engineering" value="10kΩ"></slex-input><slex-input id="r2" label="R2" type="engineering" value="2.2kΩ"></slex-input></slex-grid>
    <slex-stat id="out" label="Output voltage" unit="V"></slex-stat>
  </slex-card>
  <script type="module">
    const controls = ["vin", "r1", "r2"].map((id) => slex.root.querySelector(`#${id}`));
    const update = () => { const [vin, r1, r2] = controls.map((node) => node.valueAsNumber); slex.root.querySelector("#out").value = [vin,r1,r2].every(Number.isFinite) ? (vin*r2/(r1+r2)).toFixed(4) : "Invalid"; };
    controls.forEach((node) => node.addEventListener("input", update)); update();
    slex.onDispose(() => controls.forEach((node) => node.removeEventListener("input", update)));
  </script></template>
  <script type="module">
    import { mount } from "/dist/slexkit.js";
    const source = document.querySelector("#source").innerHTML;
    const handle = mount(source, document.querySelector("#app"), { secureFrame: { runtimeUrl: "/slexkit.runtime.js", styleUrl: "/dist/slexkit.css" } });
    await handle.ready;
  </script>
</body>
</html>
