<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SlexKit custom component example</title>
    <link rel="stylesheet" href="/dist/slexkit.css">
    <link rel="stylesheet" href="/shared/examples.css">
  </head>
  <body>
    <main class="example-shell">
      <header class="example-header">
        <div class="example-kicker">Standard custom elements</div>
        <h1 class="example-title">Use a host-defined element</h1>
        <p class="example-description">
          The host registers a standard custom element before mounting an isolated HTML document.
        </p>
      </header>
      <section class="example-grid two">
        <div class="example-panel">
          <h2>Mounted runtime</h2>
          <div id="app"></div>
          <div class="example-actions">
            <button id="dispose" class="example-button">Dispose document</button>
            <button id="remount" class="example-button primary">Mount again</button>
          </div>
        </div>
        <div class="example-panel">
          <h2>Lifecycle log</h2>
          <pre id="log" class="example-output">No lifecycle events yet.</pre>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
