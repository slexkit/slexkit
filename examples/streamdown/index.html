<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SlexKit Streamdown example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
    <link rel="stylesheet" href="/dist/slexkit.css">
    <link rel="stylesheet" href="/packages/streamdown/style.css">
    <link rel="stylesheet" href="/shared/examples.css">
    <link rel="stylesheet" href="/shared/adapter-host.css">
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
      {
        "imports": {
          "slexkit": "/dist/slexkit.js",
          "slexkit/tooling": "/dist/tooling.js",
          "@slexkit/streamdown": "/packages/streamdown/dist/index.js",
          "@streamdown/math": "https://esm.sh/@streamdown/math?deps=react@19.2.6,react-dom@19.2.6",
          "react": "https://esm.sh/react@19.2.6",
          "react/jsx-runtime": "https://esm.sh/react@19.2.6/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.2.6?deps=react@19.2.6",
          "react-dom/client": "https://esm.sh/react-dom@19.2.6/client?deps=react@19.2.6",
          "streamdown": "https://esm.sh/streamdown@2.5.0?deps=react@19.2.6,react-dom@19.2.6"
        }
      }
    </script>
  </head>
  <body>
    <main class="example-shell adapter-example-shell">
      <header class="example-header adapter-example-hero">
        <div class="example-kicker">Streamdown host</div>
        <h1 class="example-title">RC Low-Pass Filter in Streamdown</h1>
        <p class="example-description">
          This page renders the same Markdown source used on the SlexKit site,
          including live <code>slex</code> fences, through the
          <code>@slexkit/streamdown</code> adapter.
        </p>
      </header>

      <section class="adapter-document-stage" aria-label="Rendered Streamdown document">
        <div id="streamdown-root" class="adapter-document streamdown-preview"></div>
      </section>

      <details class="adapter-source-panel">
        <summary>Markdown source</summary>
        <pre id="markdown-source" class="example-code adapter-source"></pre>
      </details>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
