name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Build packages
        run: bun run build

      - name: Refresh local file dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Install Chromium for website acceptance
        timeout-minutes: 5
        run: |
          bunx playwright install chromium
          # Hosted runners normally have the browser libraries already. Avoid
          # an unconditional apt update (and its long DNS retry loop); only
          # install OS dependencies if a real launch shows they are missing.
          if ! node --input-type=module -e 'import { chromium } from "playwright"; const b = await chromium.launch(); await b.close()'; then
            timeout 180s bunx playwright install-deps chromium
            node --input-type=module -e 'import { chromium } from "playwright"; const b = await chromium.launch(); await b.close()'
          fi

      - name: Verify website interactions and request limits
        run: bun run browser:acceptance

      - name: Release smoke
        run: bun run smoke:release
